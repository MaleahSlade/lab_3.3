<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="styles.css">
    <title>QR Code Card: Tailwind Version</title>

</head>


<body class="bg-sky-100">

<main >
   
    <div id="container" class="bg-white flex flex-col justify-self-center items-center text-center gap-4 w-full max-w-[14.688rem] h-full p-[.625rem] m-[.125rem] border border-white rounded-[1.25rem]" >

        <div>
            <img src="./images/qr-code.png" class="w-full max-w-[12.5rem] rounded-[1.25rem]" alt="qr code on blue background">
        </div>
    
        <h1><strong>Improve your front-end skills by building projects</strong></h1>
        <p>Scan the QR code to visit Frontend Mentor and take your coding skills to the next level</p>
    
    </div>

</main>

</body>
